name: Nightly

# The full suite against the live application, once a day and on demand.
# The HTML report of the live run is published to GitHub Pages. It is built without traces,
# screenshots or videos (PUBLISH_REPORT), and scripts/check-report.ts must find no credential or
# session token in it, or nothing is published. No other report artifacts: traces record typed
# input, and artifacts of a public repository can be downloaded by anyone. The one exception is
# the images of a failed screenshot comparison.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  live:
    name: Full suite against the live app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report: ${{ steps.check.outcome }}
    env:
      PUBLISH_REPORT: "1"
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_LOGIN_USER_EMAIL: ${{ secrets.E2E_LOGIN_USER_EMAIL }}
      E2E_LOGIN_USER_PASSWORD: ${{ secrets.E2E_LOGIN_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Check the report holds no credentials
        id: check
        if: ${{ !cancelled() }}
        run: node scripts/check-report.ts
      - name: Upload the report for Pages
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report
      - name: Install k6 (pinned release, checksum verified)
        if: ${{ !cancelled() }}
        env:
          K6_VERSION: v2.3.0
          K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
        run: |
          curl -fsSL -o k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum -c -
          sudo tar -xzf k6.tar.gz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version
      - name: Performance smoke (k6)
        if: ${{ !cancelled() }}
        run: k6 run perf/smoke.ts

  visual:
    name: Screenshots against the baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image the baselines were made in (scripts/visual.sh), pinned by digest. Keep its version
    # in step with @playwright/test: browsers render differently between releases.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      VISUAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project=visual
      # Only the three images of a failed comparison: they show fictional data, and the signed-in
      # account's email is replaced before every screenshot. Never traces or failure screenshots,
      # which can show the sign-in.
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: |
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
          retention-days: 7

  publish:
    name: Publish the report
    needs: live
    # Also after a failed run: that report is the one worth reading. Never without a clean check.
    if: ${{ !cancelled() && needs.live.outputs.report == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
