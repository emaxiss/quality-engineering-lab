name: Nightly

# The full suite against the live application, once a day and on demand.
# No report artifacts: traces record typed input, including the sign-in password, and
# artifacts of a public repository can be downloaded by anyone. Failures show up as
# annotations on the run.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  live:
    name: Full suite against the live app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_LOGIN_USER_EMAIL: ${{ secrets.E2E_LOGIN_USER_EMAIL }}
      E2E_LOGIN_USER_PASSWORD: ${{ secrets.E2E_LOGIN_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
