name: Nightly

# The full suite against the live application, once a day and on demand.
# No report artifacts: traces record typed input, including the sign-in password, and
# artifacts of a public repository can be downloaded by anyone. Failures show up as
# annotations on the run.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  live:
    name: Full suite against the live app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_LOGIN_USER_EMAIL: ${{ secrets.E2E_LOGIN_USER_EMAIL }}
      E2E_LOGIN_USER_PASSWORD: ${{ secrets.E2E_LOGIN_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Install k6 (pinned release, checksum verified)
        if: ${{ !cancelled() }}
        env:
          K6_VERSION: v2.3.0
          K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
        run: |
          curl -fsSL -o k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  k6.tar.gz" | sha256sum -c -
          sudo tar -xzf k6.tar.gz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version
      - name: Performance smoke (k6)
        if: ${{ !cancelled() }}
        run: k6 run perf/smoke.ts
